<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Registration Form</title>
<style>body{font-family:Arial,sans-serif;max-width:650px;margin:24px auto;padding:0 16px}label{display:block;margin-top:12px}input{padding:8px;max-width:100%}fieldset{margin-top:16px;padding:16px}</style></head>
<body>
  <h1>Student Registration Form</h1>
  <form>
    <fieldset><legend>Personal Information</legend>
      <label for="name">Full Name:</label><input id="name" name="name" type="text" required>
      <label for="email">Email:</label><input id="email" name="email" type="email" required>
      <label for="phone">Mobile Number:</label><input id="phone" name="phone" type="tel">
      <label for="dob">Date of Birth:</label><input id="dob" name="dob" type="date">
      <label for="photo">Upload Photo:</label><input id="photo" name="photo" type="file" accept="image/*">
      <p>Gender:</p><label><input type="radio" name="gender" value="male"> Male</label><label><input type="radio" name="gender" value="female"> Female</label>
      <label><input type="checkbox" name="agree" required> I confirm that the information is correct.</label>
    </fieldset>
    <button type="submit">Register</button>
    <button type="reset">Reset</button>
  </form>
</body>
</html>
