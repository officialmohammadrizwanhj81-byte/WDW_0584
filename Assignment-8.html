<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hyperlinks and Images</title></head>
<body>
  <h1>Hyperlinks and Images</h1>
  <p><a href="#details">Internal link: Go to details</a></p>
  <p><a href="https://www.w3.org/" target="_blank" rel="noopener noreferrer">External link: W3C website</a></p>
  <p><a href="mailto:student@example.com">Send an email</a></p>
  <h2 id="details">Image with attributes</h2>
  <img src="https://placehold.co/600x300?text=HTML+Learning" alt="Placeholder banner about learning HTML" width="600" height="300">
  <p>The image uses src, alt, width and height attributes.</p>
</body>
</html>
