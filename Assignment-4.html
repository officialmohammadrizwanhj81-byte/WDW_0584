<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Semantic and Non-Semantic Elements</title>
<style>body{font-family:Arial;margin:0}header,nav,main,section,footer,.box{padding:16px;margin:10px;background:#eef2ff}nav a{margin-right:16px}</style></head>
<body>
  <header><h1>My College Website</h1></header>
  <nav aria-label="Main navigation"><a href="#home">Home</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
  <main id="home"><section id="about"><h2>About Us</h2><p>This page uses semantic HTML elements such as header, nav, main, section and footer.</p></section></main>
  <div class="box"><h2>Non-semantic div example</h2><p>A div is a generic container and does not describe its content.</p></div>
  <footer id="contact">© 2026 My College Website</footer>
</body>
</html>
