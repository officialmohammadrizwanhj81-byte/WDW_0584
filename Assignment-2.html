  <h1>HTML Text Formatting</h1>
  <h2>Introduction</h2>
  <h3>About HTML</h3>
  <p>HTML stands for <strong>HyperText Markup Language</strong>. It is used to create web pages.</p>

  <p>Mathematical expression: x<sup>2</sup> + y<sup>2</sup></p>
