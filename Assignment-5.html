<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HTML Lists</title></head>
<body>
  <h1>HTML List Types</h1>
  <h2>Unordered List: Fruits</h2><ul><li>Apple</li><li>Banana</li><li>Mango</li></ul>
  <h2>Ordered List: Daily Routine</h2><ol><li>Wake up</li><li>Attend classes</li><li>Study</li></ol>
  <h2>Description List: Web Terms</h2><dl><dt>HTML</dt><dd>Structures web pages.</dd><dt>CSS</dt><dd>Styles web pages.</dd><dt>JavaScript</dt><dd>Adds interactivity.</dd></dl>
</body>
</html>
