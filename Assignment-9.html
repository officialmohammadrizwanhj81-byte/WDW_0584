<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quotation and Citation</title></head>
<body>
  <h1>Quotation and Citation Elements</h1>
  <h2>Blockquote</h2>
  <blockquote cite="https://www.w3.org/"><p>The web is for everyone.</p></blockquote>
  <h2>Inline quotation</h2>
  <p>Our teacher said, <q>Practice makes a developer better.</q></p>
  <h2>Citation</h2>
  <p>Reference: <cite>HTML Living Standard</cite>.</p>
  <h2>Abbreviation</h2>
  <p><abbr title="World Wide Web Consortium">W3C</abbr> develops web standards. Hover over W3C to see its full form.</p>
</body>
</html>
