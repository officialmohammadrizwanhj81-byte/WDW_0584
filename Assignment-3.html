<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Block and Inline Elements</title>
<style>
  body{font-family:Arial,sans-serif;line-height:1.6;padding:24px}
  .block{background:#dbeafe;padding:12px;margin:8px 0}
  .inline{background:#fde68a;padding:4px}
</style></head>
<body>
  <h1>Block and Inline Elements</h1>
  <h2>Block Elements</h2>
  <div class="block">This is a div (block element).</div>
  <p class="block">This is a paragraph (block element).</p>
  <h2>Inline Elements</h2>
  <p>Inline elements stay in the same line: <span class="inline">span element</span> and <a href="#top">a link</a>.</p>
</body>
</html>
